# CI for the GCP Firewall Ops Agent.
#   test       - lint + offline unit/integration tests + ADK evaluator (scripted model) + golden regression eval
#   terraform  - fmt/validate the infrastructure as code
#   live-eval  - manual: real Gemini evaluation using keyless Workload Identity Federation (no JSON keys)
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FIREWALL_DATA_MODE: sample
      MEMORY_BACKEND: in_memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit, integration and offline evaluation tests
        run: pytest -q
      - name: Golden-dataset regression evaluation
        run: python -m eval.run_golden_eval

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Terraform validate
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

  live-eval:
    if: github.event_name == 'workflow_dispatch' && vars.WIF_PROVIDER != ''
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # keyless auth to Google Cloud
    env:
      GOOGLE_GENAI_USE_ENTERPRISE: "true"
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_LOCATION: global
      FIREWALL_DATA_MODE: sample
      MEMORY_BACKEND: in_memory
      RUN_LIVE_EVAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - run: pip install -r requirements-dev.txt
      - name: Live agent evaluation (tool trajectory + response match)
        run: pytest tests/test_agent_evaluation.py -m live -q
