[project]
name = "gcp-firewall-ops-agent"
version = "1.0.0"
description = "Multi-agent GCP firewall auditor and coach built with Google's Agent Development Kit (ADK) on Gemini Enterprise Agent Platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "google-adk[db,otel]==2.15.0",
  "google-cloud-compute>=1.58.0",
  "google-cloud-secret-manager>=2.32.0",
  "google-cloud-dlp>=3.40.0",
  "pydantic>=2.11",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "pytest-asyncio>=1.0", "ruff>=0.17"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "ignore:.*EXPERIMENTAL.*:UserWarning",
  "ignore::DeprecationWarning:google.*",
  "ignore:.*SequentialAgent is deprecated.*:DeprecationWarning",
]
markers = ["live: requires Google Cloud credentials and a deployed model (RUN_LIVE_EVAL=1)"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".adk_data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP042"]  # UP042: keep (str, Enum) for explicit, stable serialization
